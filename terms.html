    fr: ''
      + '<div class="doc-head"><p class="eyebrow">Conditions d’utilisation</p><h1>Transcry — Conditions d’utilisation</h1><p class="sub">Dernière mise à jour : 5 novembre 2026</p></div>'
      + '<p class="lead">Ces Conditions d’utilisation (&laquo;&nbsp;Conditions&nbsp;&raquo;) régissent votre utilisation de <strong>Transcry</strong> (&laquo;&nbsp;l’app&nbsp;&raquo;), une app de reconnaissance vocale publiée par <strong>FX2 Information Services Limited</strong> (&laquo;&nbsp;FX2&nbsp;&raquo;, &laquo;&nbsp;nous&nbsp;&raquo;). En installant ou en utilisant l’app, vous acceptez ces Conditions. Si vous n’êtes pas d’accord, n’utilisez pas l’app.</p>'

      + '<h2>3. Comment l’app fonctionne</h2><p>Transcry convertit la parole en texte. Selon le mode que <strong>vous</strong> choisissez, la transcription s’exécute entièrement sur votre appareil (hors ligne), via le service de reconnaissance vocale de votre appareil, ou via un fournisseur cloud tiers à l’aide d’une clé API que <strong>vous</strong> fournissez. Le détail du traitement des données figure dans notre <a href="privacy.html">Politique de confidentialité</a>.</p>'

      + '<li>L’audio ou le texte que vous envoyez à un fournisseur tiers va <strong>directement de votre appareil à ce fournisseur</strong> et ne passe pas par les serveurs de FX2.</li></ul>'
      + '<h2>5. Formules, achats et abonnements</h2><ul>'

      + '<li><strong>Gérez ou résiliez</strong> un abonnement à tout moment dans Google Play → Abonnements. La résiliation arrête les renouvellements futurs ; l’accès se poursuit jusqu’à la fin de la période déjà payée.</li>'
      + '<li>Les <strong>prix</strong> peuvent changer ; nous vous informerons comme l’exigent Google Play et la loi applicable avant qu’un changement ne vous concerne.</li></ul>'
      + '<h2>6. Remboursements</h2><p>Les remboursements des achats effectués via Google Play sont traités selon les <strong>politiques de remboursement de Google Play</strong> et vos droits légaux. Pour tout problème d’achat ou de remboursement, utilisez les canaux d’assistance de Google Play. Lorsque vous disposez d’un droit légal au remboursement selon les lois de votre pays, ces Conditions n’affectent pas ces droits.</p>'

      + '<h2>9. Propriété intellectuelle</h2><p>L’app elle-même, son nom, son design et son code appartiennent à FX2 ou à ses concédants et sont protégés par la loi. Les modèles de parole et de traduction sur l’appareil sont fournis par leurs concédants tiers respectifs selon leurs propres licences.</p>'
      + '<h2>10. Exclusion de garanties</h2><p>La transcription et la traduction sont produites par des modèles d’apprentissage automatique et <strong>peuvent contenir des erreurs</strong>. L’app est fournie <strong>&laquo;&nbsp;en l’état&nbsp;&raquo; et &laquo;&nbsp;selon disponibilité&nbsp;&raquo;</strong>, sans garantie d’aucune sorte dans toute la mesure permise par la loi. Vous ne devriez pas vous fier au résultat lorsque l’exactitude est critique sans le vérifier de façon indépendante. Nous ne garantissons pas que l’app sera ininterrompue ou sans erreur, ni que les services tiers auxquels elle peut se connecter seront disponibles.</p>'
      + '<h2>11. Limitation de responsabilité</h2><p>Dans toute la mesure permise par la loi, FX2 ne sera pas responsable des pertes indirectes ou consécutives, de la perte de données, ni des frais qu’un fournisseur tiers que vous avez choisi d’utiliser vous facture. <strong>Rien dans ces Conditions ne limite ni n’exclut la responsabilité qui ne peut être limitée ou exclue par la loi</strong>, y compris la responsabilité en cas de décès ou de dommage corporel causé par une négligence, en cas de fraude, ou vos droits impératifs de consommateur.</p>'
      + '<h2>12. Droits des consommateurs (EEE / Royaume-Uni)</h2><p>Si vous êtes un consommateur dans l’Espace économique européen ou au Royaume-Uni, vous disposez de droits légaux (y compris, le cas échéant, les droits relatifs aux contenus numériques et le droit de rétractation) que ces Conditions n’affectent pas. Ces Conditions s’appliquent en complément de ces droits et ne les remplacent pas.</p>'
      + '<h2>13. Modifications de ces Conditions</h2><p>Nous pouvons mettre à jour ces Conditions à mesure que l’app évolue. La date de &laquo;&nbsp;Dernière mise à jour&nbsp;&raquo; ci-dessus reflète la version actuelle. Si une modification réduit sensiblement vos droits, nous prendrons des mesures raisonnables pour vous en informer. Continuer à utiliser l’app après une modification vaut acceptation des Conditions mises à jour.</p>'
      + '<h2>14. Résiliation</h2><p>Vous pouvez cesser d’utiliser l’app et la désinstaller à tout moment. Nous pouvons suspendre ou mettre fin à votre licence si vous enfreignez de manière substantielle ces Conditions ou utilisez l’app de façon illicite. Les clauses qui par leur nature doivent survivre (par exemple les exclusions de garantie et les limitations de responsabilité) continuent de s’appliquer après la résiliation.</p>'
      + '<h2>15. Droit applicable</h2><p>Ces Conditions sont régies par le droit <strong>d’Angleterre et du pays de Galles</strong>. Si vous êtes un consommateur, vous bénéficiez des protections impératives du droit de votre pays de résidence et vous pouvez agir devant les tribunaux de ce pays lorsque la loi le permet.</p>'
      + '<h2>16. Contact</h2><p>Questions sur ces Conditions : <strong>info@fx2.it</strong></p>',

      + '<div class="doc-head"><p class="eyebrow">Nutzungsbedingungen</p><h1>Transcry — Nutzungsbedingungen</h1><p class="sub">Zuletzt aktualisiert: 5. November 2026</p></div>'
      + '<p class="lead">Diese Nutzungsbedingungen (&bdquo;Bedingungen&ldquo;) regeln deine Nutzung von <strong>Transcry</strong> (&bdquo;die App&ldquo;), einer Sprache-zu-Text-App, herausgegeben von <strong>FX2 Information Services Limited</strong> (&bdquo;FX2&ldquo;, &bdquo;wir&ldquo;). Mit der Installation oder Nutzung der App stimmst du diesen Bedingungen zu. Wenn du nicht zustimmst, nutze die App nicht.</p>'
      + '<h2>1. Wer wir sind</h2><p>Die App wird von <strong>FX2 Information Services Limited</strong> bereitgestellt, einem in England und Wales eingetragenen Unternehmen. Kontakt: <strong>info@fx2.it</strong>.</p>'
      + '<h2>2. Lizenz zur Nutzung der App</h2><p>Wir gewähren dir eine persönliche, nicht ausschließliche, nicht übertragbare und widerrufliche Lizenz, die App auf von dir kontrollierten Geräten zu installieren und für deine rechtmäßige Nutzung zu verwenden, vorbehaltlich dieser Bedingungen und der <strong>Google-Play-Nutzungsbedingungen</strong>. Du darfst die App nicht kopieren, verändern, zurückentwickeln, weiterverkaufen oder weiterverbreiten, außer soweit diese Einschränkung gesetzlich nicht ausgeschlossen werden kann.</p>'
      + '<h2>3. Wie die App funktioniert</h2><p>Transcry wandelt Sprache in Text um. Je nach dem von <strong>dir</strong> gewählten Modus läuft die Transkription vollständig auf deinem Gerät (offline), über den Spracherkennungsdienst deines Geräts oder über einen Drittanbieter in der Cloud mithilfe eines API-Schlüssels, den <strong>du</strong> bereitstellst. Einzelheiten zur Datenverarbeitung findest du in unserer <a href="privacy.html">Datenschutzerklärung</a>.</p>'
      + '<h2>4. Deine eigenen API-Schlüssel und Drittanbieter (BYOK)</h2><ul>'
      + '<li>Wenn du deinen eigenen API-Schlüssel eines Cloud-Anbieters (etwa Groq, OpenAI oder AssemblyAI) eingibst, nutzt du <strong>dein eigenes Konto</strong> bei diesem Anbieter. Du bist allein verantwortlich für deine Schlüssel, deren Vertraulichkeit und jede Nutzung, Gebühr oder Abrechnung, die dieser Anbieter dir in Rechnung stellt.</li>'
      + '<li>Deine Nutzung eines Drittanbieters unterliegt den <strong>Bedingungen und der Datenschutzerklärung dieses Anbieters</strong>. FX2 ist nicht Partei dieser Beziehung und <strong>nicht verantwortlich</strong> für Drittanbieterdienste, deren Verfügbarkeit, Genauigkeit, Preise oder Datenpraktiken.</li>'
      + '<li>Audio oder Text, den du an einen Drittanbieter sendest, geht <strong>direkt von deinem Gerät an diesen Anbieter</strong> und läuft nicht über die Server von FX2.</li></ul>'
      + '<h2>5. Pläne, Käufe und Abonnements</h2><ul>'
      + '<li><strong>Die Abrechnung erfolgt über Google Play.</strong> Jeder Kauf — eine einmalige Freischaltung oder ein Abonnement — wird von <strong>Google Play Billing</strong> über dein Google-Konto abgewickelt. Wir erhalten oder speichern deine Zahlungskartendaten nicht.</li>'
      + '<li><strong>Abonnements</strong> (zum Beispiel ein monatlicher oder jährlicher Pro-Plan) verlängern sich automatisch zum jeweils gültigen Preis bis zur Kündigung. Ein etwaig angebotener kostenloser Testzeitraum geht in ein kostenpflichtiges Abonnement über, sofern du nicht vor dessen Ende kündigst.</li>'
      + '<li><strong>Verwalte oder kündige</strong> ein Abonnement jederzeit in Google Play → Abos. Eine Kündigung stoppt künftige Verlängerungen; der Zugang bleibt bis zum Ende des bereits bezahlten Zeitraums bestehen.</li>'
      + '<li><strong>Preise</strong> können sich ändern; wir informieren dich, wie von Google Play und dem anwendbaren Recht verlangt, bevor eine Änderung dich betrifft.</li></ul>'
      + '<h2>6. Erstattungen</h2><p>Erstattungen für über Google Play getätigte Käufe werden nach den <strong>Erstattungsrichtlinien von Google Play</strong> und deinen gesetzlichen Rechten abgewickelt. Bei Kauf- oder Erstattungsfragen nutze die Support-Kanäle von Google Play. Soweit dir nach den Gesetzen deines Landes ein gesetzliches Erstattungsrecht zusteht, werden diese Rechte durch diese Bedingungen nicht berührt.</p>'
      + '<h2>7. Zulässige Nutzung</h2><p>Du erklärst dich bereit, die App nicht zu nutzen, um gegen Gesetze zu verstoßen, Rechte anderer zu verletzen oder Audio ohne die nach dem für dich geltenden Recht erforderliche Einwilligung aufzunehmen oder zu transkribieren. Du bist für die Inhalte verantwortlich, die du mit der App erfasst, transkribierst, speicherst oder teilst.</p>'
      + '<h2>8. Deine Inhalte</h2><p>Transkripte, Übersetzungen, Audio und Einstellungen, die du erstellst, bleiben <strong>auf deinem Gerät</strong> (siehe Datenschutzerklärung). Du behältst alle Rechte an deinen Inhalten. Wir beanspruchen kein Eigentum daran und greifen nicht darauf zu.</p>'

      + '<h2>11. Haftungsbeschränkung</h2><p>Soweit gesetzlich zulässig, haftet FX2 nicht für mittelbare oder Folgeschäden, Datenverlust oder Gebühren, die dir ein von dir gewählter Drittanbieter berechnet. <strong>Nichts in diesen Bedingungen beschränkt oder schließt eine Haftung aus, die gesetzlich nicht beschränkt oder ausgeschlossen werden kann</strong>, einschließlich der Haftung für Tod oder Körperverletzung durch Fahrlässigkeit, für Betrug oder deiner zwingenden Verbraucherrechte.</p>'
      + '<h2>12. Verbraucherrechte (EWR / UK)</h2><p>Wenn du Verbraucher im Europäischen Wirtschaftsraum oder im Vereinigten Königreich bist, hast du gesetzliche Rechte (einschließlich, soweit zutreffend, Rechte in Bezug auf digitale Inhalte und das Widerrufsrecht), die durch diese Bedingungen nicht berührt werden. Diese Bedingungen gelten zusätzlich zu diesen Rechten und ersetzen sie nicht.</p>'
      + '<h2>13. Änderungen dieser Bedingungen</h2><p>Wir können diese Bedingungen aktualisieren, wenn sich die App ändert. Das Datum &bdquo;Zuletzt aktualisiert&ldquo; oben spiegelt die aktuelle Version wider. Wenn eine Änderung deine Rechte wesentlich einschränkt, werden wir angemessene Schritte unternehmen, um dich zu informieren. Die weitere Nutzung der App nach einer Änderung bedeutet, dass du die aktualisierten Bedingungen akzeptierst.</p>'
      + '<h2>14. Beendigung</h2><p>Du kannst die Nutzung der App jederzeit beenden und sie deinstallieren. Wir können deine Lizenz aussetzen oder beenden, wenn du wesentlich gegen diese Bedingungen verstößt oder die App rechtswidrig nutzt. Klauseln, die ihrer Natur nach fortbestehen sollten (zum Beispiel Haftungsausschlüsse und Haftungsbeschränkungen), gelten auch nach Beendigung weiter.</p>'
      + '<h2>15. Anwendbares Recht</h2><p>Diese Bedingungen unterliegen dem Recht von <strong>England und Wales</strong>. Als Verbraucher genießt du die zwingenden Schutzvorschriften des Rechts deines Wohnsitzlandes und kannst dort vor Gericht gehen, wo das Gesetz dies zulässt.</p>'
      + '<h2>16. Kontakt</h2><p>Fragen zu diesen Bedingungen: <strong>info@fx2.it</strong></p>'

  (function () {
    var root = document.documentElement;
    var sel = document.getElementById('langSel');
    var themeBtn = document.getElementById('themeBtn');
    var doc = document.getElementById('doc');

    function pickLang() {
      var saved; try { saved = localStorage.getItem('transcry-site-lang'); } catch (e) {}
      if (saved && DOC[saved]) return saved;
      var n = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return DOC[n] ? n : 'en';
    }
    function apply(lang) {
      if (!DOC[lang]) lang = 'en';
      doc.innerHTML = DOC[lang] + '<p class="i18n-note">' + NOTE[lang] + '</p>';
      var c = CHROME[lang];
      document.getElementById('backTxt').textContent = c.back;
      document.getElementById('fHome').textContent = c.home;
      document.getElementById('fPrivacy').textContent = c.privacy;
      document.getElementById('legalTxt').innerHTML = c.legal;
      root.setAttribute('lang', lang);
      sel.value = lang;
    }
    sel.addEventListener('change', function () {
      apply(sel.value);
      try { localStorage.setItem('transcry-site-lang', sel.value); } catch (e) {}
    });
    apply(pickLang());

    try { var st = localStorage.getItem('transcry-site-theme'); if (st) root.setAttribute('data-theme', st); } catch (e) {}
    function curTheme() {
      var a = root.getAttribute('data-theme');
      if (a) return a;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    themeBtn.addEventListener('click', function () {
      var next = curTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('transcry-site-theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
