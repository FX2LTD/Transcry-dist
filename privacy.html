      + '<h2>Qué se guarda en tu dispositivo</h2><ul><li><strong>Las transcripciones y traducciones</strong> que guardas, y opcionalmente el <strong>audio original</strong> de los elementos guardados, se almacenan <strong>solo en tu dispositivo</strong> (en el almacenamiento local de la app). Esta función no los sube. Al eliminar un elemento, o la app, se borran.</li><li><strong>Tus ajustes</strong>, incluidas las <strong>claves API</strong> que introduzcas, se guardan <strong>solo en tu dispositivo</strong> para que la app pueda reutilizarlos. Las claves no se transmiten a FX2.</li></ul>'
      + '<h2>La descarga del modelo de voz</h2><p>El modelo de voz en el dispositivo se descarga de <strong>huggingface.co</strong> la primera vez que eliges instalarlo. Es una descarga normal de un modelo de ML; no se envían datos personales para obtenerlo.</p>'
      + '<h2>Compras (Google Play Billing)</h2><p>Si compras un plan (desbloqueo único o suscripción), la compra la gestiona <strong>Google Play Billing</strong>. Para confirmar qué compraste, la app envía el <strong>token de compra de Google</strong> y un <strong>identificador de instalación anónimo y generado al azar</strong> a nuestro servidor de verificación, que lo comprueba con Google y registra el estado de tu plan. Este servidor <strong>nunca recibe tu audio, transcripciones ni claves API</strong>, y el identificador de instalación no se vincula a tu nombre, correo ni cuenta de Google. Google procesa el pago según su propia política de privacidad.</p>'

    fr: ''
      + '<div class="doc-head"><p class="eyebrow">Politique de confidentialité</p><h1>Transcry — Politique de confidentialité</h1><p class="sub">Dernière mise à jour : 9 octobre 2026</p></div>'
      + '<p class="lead">Transcry (&laquo;&nbsp;l’app&nbsp;&raquo;) est une app de reconnaissance vocale publiée par FX2 (&laquo;&nbsp;nous&nbsp;&raquo;). Cette politique explique ce que l’app fait de vos données. En bref : <strong>Transcry est conçue pour garder votre audio et votre texte sur votre appareil.</strong> Nous n’utilisons aucune analyse, nous n’avons pas de comptes utilisateur et nous ne vendons jamais vos données.</p>'
      + '<h2>Qui est le développeur</h2><p>FX2 — contact : <strong>info@fx2.it</strong></p>'
      + '<h2>Ce que l’app fait de votre voix et de votre texte</h2><p>La façon dont votre audio est traité dépend du mode de transcription que <strong>vous</strong> choisissez dans l’app :</p>'
      + '<ul><li><strong>Transcription sur l’appareil (par défaut, totalement hors ligne).</strong> Lorsque vous utilisez le modèle vocal téléchargé, votre audio est transcrit <strong>entièrement sur votre appareil</strong>. L’audio et le texte obtenu <strong>ne sont envoyés nulle part</strong>.</li>'
      + '<li><strong>Mode Live (reconnaissance vocale de l’appareil).</strong> Le mode Live utilise <strong>le service de reconnaissance vocale de votre appareil</strong> (par exemple celui fourni par Google sur votre téléphone). Votre audio parlé est traité par ce service système selon <strong>ses propres</strong> conditions de confidentialité — Transcry ne reçoit ni ne conserve de copie au-delà de la transcription qu’elle vous montre.</li>'
      + '<li><strong>Transcription en ligne avec votre propre clé API (BYOK).</strong> Si vous saisissez votre propre clé API d’un fournisseur cloud, Transcry envoie l’audio que vous choisissez de transcrire <strong>directement au fournisseur sélectionné</strong>, avec votre clé :<ul><li><strong>Groq</strong>, <strong>OpenAI</strong> ou <strong>AssemblyAI</strong> (votre choix).</li><li>Pour les étiquettes de locuteur d’<strong>AssemblyAI</strong>, l’<strong>intégralité du fichier audio original</strong> est transférée vers AssemblyAI pour traitement.</li><li>L’audio va <strong>directement de votre appareil à ce fournisseur</strong> — il <strong>ne</strong> passe <strong>pas</strong> par les serveurs de FX2. Votre utilisation d’un fournisseur est régie par la <strong>politique de confidentialité de ce fournisseur</strong> et votre compte chez lui.</li></ul></li>'
      + '<li><strong>Traduction (facultative).</strong> Si vous traduisez une transcription avec votre propre clé cloud, le <strong>texte</strong> à traduire est envoyé directement au fournisseur que vous avez configuré (Groq ou OpenAI). La traduction hors ligne, lorsqu’elle est disponible, reste sur votre appareil.</li></ul>'
      + '<p>Vous choisissez le mode. Rien n’est envoyé à moins que vous ne choisissiez une option en ligne et ne fournissiez votre propre clé.</p>'
      + '<h2>Ce qui est stocké sur votre appareil</h2><ul><li><strong>Les transcriptions et traductions</strong> que vous enregistrez, et éventuellement l’<strong>audio original</strong> des éléments enregistrés, sont stockés <strong>uniquement sur votre appareil</strong> (dans le stockage local de l’app). Cette fonction ne les envoie pas. Supprimer un élément, ou l’app, les efface.</li><li><strong>Vos réglages</strong>, y compris les <strong>clés API</strong> que vous saisissez, sont stockés <strong>uniquement sur votre appareil</strong> afin que l’app puisse les réutiliser. Les clés ne sont pas transmises à FX2.</li></ul>'
      + '<h2>Le téléchargement du modèle vocal</h2><p>Le modèle vocal sur l’appareil est téléchargé depuis <strong>huggingface.co</strong> la première fois que vous choisissez de l’installer. C’est un téléchargement normal d’un modèle de ML ; aucune donnée personnelle n’est envoyée pour l’obtenir.</p>'
      + '<h2>Achats (Google Play Billing)</h2><p>Si vous achetez une formule (déblocage unique ou abonnement), l’achat est géré par <strong>Google Play Billing</strong>. Pour confirmer votre achat, l’app envoie le <strong>jeton d’achat Google</strong> et un <strong>identifiant d’installation anonyme généré aléatoirement</strong> à notre serveur de vérification, qui le contrôle auprès de Google et enregistre l’état de votre formule. Ce serveur <strong>ne reçoit jamais votre audio, vos transcriptions ni vos clés API</strong>, et l’identifiant d’installation n’est lié ni à votre nom, ni à votre e-mail, ni à votre compte Google. Google traite le paiement selon sa propre politique de confidentialité.</p>'
      + '<h2>Retours</h2><p>Si vous utilisez l’option de retour dans l’app, l’app <strong>ouvre votre propre app de messagerie</strong> avec un message adressé à info@fx2.it. Rien n’est envoyé automatiquement — vous décidez de l’envoyer et vous pouvez tout voir et modifier (y compris les détails de diagnostic) avant. Si vous nous écrivez, nous recevons ce que vous envoyez.</p>'
      + '<h2>Ce que nous <em>ne</em> faisons <em>pas</em></h2><ul><li><strong>Aucune analyse ni suivi.</strong> L’app ne contient aucun SDK d’analyse, de publicité ou de suivi.</li><li><strong>Aucun compte.</strong> Pas d’inscription ni de profil.</li><li><strong>Aucune vente ni partage</strong> de données personnelles avec des tiers à leurs propres fins. (Les seuls tiers concernés sont ceux que <strong>vous</strong> choisissez : le service vocal de votre appareil, tout fournisseur cloud pour lequel vous fournissez une clé, Google pour les paiements et Hugging Face pour le téléchargement du modèle.)</li></ul>'
      + '<h2>Enfants</h2><p>Transcry est un outil de productivité généraliste et n’est pas destiné aux enfants.</p>'

      + '<h2>Modifications</h2><p>Nous pouvons mettre à jour cette politique à mesure que l’app évolue. La date de &laquo;&nbsp;Dernière mise à jour&nbsp;&raquo; ci-dessus reflète la version actuelle.</p>'
      + '<h2>Contact</h2><p>Questions sur cette politique ou vos données : <strong>info@fx2.it</strong></p>',

    de: ''
      + '<div class="doc-head"><p class="eyebrow">Datenschutzerklärung</p><h1>Transcry — Datenschutzerklärung</h1><p class="sub">Zuletzt aktualisiert: 9. Oktober 2026</p></div>'
      + '<p class="lead">Transcry (&bdquo;die App&ldquo;) ist eine Sprache-zu-Text-App, herausgegeben von FX2 (&bdquo;wir&ldquo;). Diese Erklärung beschreibt, was die App mit deinen Daten macht. Kurz gesagt: <strong>Transcry ist darauf ausgelegt, dein Audio und deinen Text auf deinem Gerät zu behalten.</strong> Wir nutzen keine Analyse, haben keine Benutzerkonten und verkaufen deine Daten niemals.</p>'
      + '<h2>Wer der Entwickler ist</h2><p>FX2 — Kontakt: <strong>info@fx2.it</strong></p>'
      + '<h2>Was die App mit deiner Stimme und deinem Text macht</h2><p>Wie dein Audio behandelt wird, hängt davon ab, welchen Transkriptionsmodus <strong>du</strong> in der App wählst:</p>'
      + '<ul><li><strong>Transkription auf dem Gerät (Standard, komplett offline).</strong> Wenn du das heruntergeladene Sprachmodell nutzt, wird dein Audio <strong>vollständig auf deinem Gerät</strong> transkribiert. Das Audio und der entstehende Text werden <strong>nirgendwohin gesendet</strong>.</li>'
      + '<li><strong>Live-Modus (Spracherkennung des Geräts).</strong> Der Live-Modus nutzt <strong>den Spracherkennungsdienst deines eigenen Geräts</strong> (zum Beispiel den von Google auf deinem Telefon). Dein gesprochenes Audio wird von diesem System-Dienst nach <strong>dessen eigenen</strong> Datenschutzbedingungen verarbeitet — Transcry erhält oder speichert keine Kopie über das angezeigte Transkript hinaus.</li>'
      + '<li><strong>Online-Transkription mit eigenem API-Schlüssel (BYOK).</strong> Wenn du deinen eigenen API-Schlüssel eines Cloud-Anbieters eingibst, sendet Transcry das Audio, das du transkribieren möchtest, <strong>direkt an den von dir gewählten Anbieter</strong>, mit deinem Schlüssel:<ul><li><strong>Groq</strong>, <strong>OpenAI</strong> oder <strong>AssemblyAI</strong> (deine Wahl).</li><li>Für die Sprecher-Kennzeichnungen von <strong>AssemblyAI</strong> wird die <strong>gesamte Original-Audiodatei</strong> zur Verarbeitung an AssemblyAI hochgeladen.</li><li>Das Audio geht <strong>direkt von deinem Gerät an diesen Anbieter</strong> — es läuft <strong>nicht</strong> über die Server von FX2. Deine Nutzung eines Anbieters unterliegt der <strong>Datenschutzerklärung dieses Anbieters</strong> und deinem Konto bei ihm.</li></ul></li>'
      + '<li><strong>Übersetzung (optional).</strong> Wenn du ein Transkript mit deinem eigenen Cloud-Schlüssel übersetzt, wird der zu übersetzende <strong>Text</strong> direkt an den von dir konfigurierten Anbieter gesendet (Groq oder OpenAI). Die Offline-Übersetzung bleibt, sofern verfügbar, auf deinem Gerät.</li></ul>'
      + '<p>Du wählst den Modus. Es wird nichts hochgeladen, es sei denn, du wählst eine Online-Option und gibst deinen eigenen Schlüssel an.</p>'
      + '<h2>Was auf deinem Gerät gespeichert wird</h2><ul><li><strong>Transkripte und Übersetzungen</strong>, die du speicherst, und optional das <strong>Original-Audio</strong> gespeicherter Einträge, werden <strong>nur auf deinem Gerät</strong> gespeichert (im lokalen Speicher der App). Diese Funktion lädt sie nicht hoch. Wenn du einen Eintrag oder die App löschst, werden sie entfernt.</li><li><strong>Deine Einstellungen</strong>, einschließlich eingegebener <strong>API-Schlüssel</strong>, werden <strong>nur auf deinem Gerät</strong> gespeichert, damit die App sie wiederverwenden kann. Schlüssel werden nicht an FX2 übertragen.</li></ul>'
      + '<h2>Der Download des Sprachmodells</h2><p>Das Sprachmodell auf dem Gerät wird von <strong>huggingface.co</strong> heruntergeladen, wenn du es zum ersten Mal installierst. Das ist ein normaler Datei-Download eines ML-Modells; zum Abruf werden keine personenbezogenen Daten gesendet.</p>'
      + '<h2>Käufe (Google Play Billing)</h2><p>Wenn du einen Plan kaufst (einmalige Freischaltung oder Abo), wird der Kauf über <strong>Google Play Billing</strong> abgewickelt. Zur Bestätigung deines Kaufs sendet die App das <strong>Google-Kauf-Token</strong> und eine <strong>anonyme, zufällig erzeugte Installations-Kennung</strong> an unseren Verifizierungsserver, der dies bei Google prüft und deinen Plan-Status speichert. Dieser Server <strong>erhält niemals dein Audio, deine Transkripte oder API-Schlüssel</strong>, und die Installations-Kennung ist nicht mit deinem Namen, deiner E-Mail oder deinem Google-Konto verknüpft. Google verarbeitet die Zahlung nach seiner eigenen Datenschutzerklärung.</p>'
      + '<h2>Feedback</h2><p>Wenn du die Feedback-Option in der App nutzt, <strong>öffnet die App deine eigene E-Mail-App</strong> mit einer Nachricht an info@fx2.it. Es wird nichts automatisch gesendet — du entscheidest, ob du sie sendest, und kannst alles (einschließlich etwaiger Diagnosedetails) vorher sehen und bearbeiten. Wenn du uns schreibst, erhalten wir, was du sendest.</p>'
      + '<h2>Was wir <em>nicht</em> tun</h2><ul><li><strong>Keine Analyse oder Tracking.</strong> Die App enthält keine Analyse-, Werbe- oder Tracking-SDKs.</li><li><strong>Keine Konten.</strong> Es gibt keine Registrierung und kein Profil.</li><li><strong>Kein Verkauf und keine Weitergabe</strong> personenbezogener Daten an Dritte für deren eigene Zwecke. (Die einzigen beteiligten Dritten sind die, die <strong>du</strong> wählst: der Sprachdienst deines Geräts, jeder Cloud-Anbieter, für den du einen Schlüssel angibst, Google für Zahlungen und Hugging Face für den Modell-Download.)</li></ul>'
      + '<h2>Kinder</h2><p>Transcry ist ein allgemeines Produktivitäts-Tool und richtet sich nicht an Kinder.</p>'
      + '<h2>Deine Optionen</h2><ul><li>Nutze den Modus <strong>auf dem Gerät</strong>, um alles offline zu halten.</li><li><strong>Gib keinen</strong> Cloud-API-Schlüssel ein, wenn du nicht willst, dass Audio oder Text dein Gerät an einen Drittanbieter verlassen.</li><li><strong>Lösche</strong> gespeicherte Transkripte/Audios jederzeit in der App, oder deinstalliere die App, um alle lokal gespeicherten Daten zu entfernen.</li></ul>'
      + '<h2>Änderungen</h2><p>Wir können diese Erklärung aktualisieren, wenn sich die App ändert. Das Datum &bdquo;Zuletzt aktualisiert&ldquo; oben spiegelt die aktuelle Version wider.</p>'
      + '<h2>Kontakt</h2><p>Fragen zu dieser Erklärung oder deinen Daten: <strong>info@fx2.it</strong></p>'
  };

  (function () {
    var root = document.documentElement;
    var sel = document.getElementById('langSel');
    var themeBtn = document.getElementById('themeBtn');
    var doc = document.getElementById('doc');

    function pickLang() {
      var saved; try { saved = localStorage.getItem('transcry-site-lang'); } catch (e) {}
      if (saved && DOC[saved]) return saved;
      var n = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return DOC[n] ? n : 'en';
    }
    function apply(lang) {
      if (!DOC[lang]) lang = 'en';
      doc.innerHTML = DOC[lang] + '<p class="i18n-note">' + NOTE[lang] + '</p>';
      var c = CHROME[lang];
      document.getElementById('backTxt').textContent = c.back;
      document.getElementById('fHome').textContent = c.home;
      document.getElementById('fFeatures').textContent = c.features;
      document.getElementById('legalTxt').innerHTML = c.legal;
      root.setAttribute('lang', lang);
      sel.value = lang;
    }
    sel.addEventListener('change', function () {
      apply(sel.value);
      try { localStorage.setItem('transcry-site-lang', sel.value); } catch (e) {}
    });
    apply(pickLang());

    try { var st = localStorage.getItem('transcry-site-theme'); if (st) root.setAttribute('data-theme', st); } catch (e) {}
    function curTheme() {
      var a = root.getAttribute('data-theme');
      if (a) return a;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    themeBtn.addEventListener('click', function () {
      var next = curTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('transcry-site-theme', next); } catch (e) {}
    });
  })();
</script>
